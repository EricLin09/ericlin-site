<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Dev NDCG@10 across training steps for six runs: all three BM25-hard-negative runs stay below all three random-negative runs">
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- grid -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="70" y1="330" x2="720" y2="330"/>
    <line x1="70" y1="270.4" x2="720" y2="270.4"/>
    <line x1="70" y1="210.8" x2="720" y2="210.8"/>
    <line x1="70" y1="151.2" x2="720" y2="151.2"/>
    <line x1="70" y1="91.5" x2="720" y2="91.5"/>
    <line x1="70" y1="31.9" x2="720" y2="31.9"/>
    <line x1="70" y1="20" x2="70" y2="330"/>
    <line x1="217.1" y1="20" x2="217.1" y2="330"/>
    <line x1="362.5" y1="20" x2="362.5" y2="330"/>
    <line x1="509.6" y1="20" x2="509.6" y2="330"/>
    <line x1="655" y1="20" x2="655" y2="330"/>
  </g>

  <!-- axes -->
  <g stroke="#9a9a9a" stroke-width="1.1">
    <line x1="70" y1="330" x2="720" y2="330"/>
    <line x1="70" y1="20" x2="70" y2="330"/>
  </g>

  <!-- y tick labels -->
  <g fill="#555" font-size="12" text-anchor="end">
    <text x="62" y="334">0.37</text>
    <text x="62" y="274.4">0.38</text>
    <text x="62" y="214.8">0.39</text>
    <text x="62" y="155.2">0.40</text>
    <text x="62" y="95.5">0.41</text>
    <text x="62" y="35.9">0.42</text>
  </g>

  <!-- x tick labels -->
  <g fill="#555" font-size="12" text-anchor="middle">
    <text x="70" y="349">0</text>
    <text x="217.1" y="349">86</text>
    <text x="362.5" y="349">171</text>
    <text x="509.6" y="349">257</text>
    <text x="655" y="349">342</text>
  </g>

  <!-- axis titles -->
  <text x="395" y="371" fill="#333" font-size="13" text-anchor="middle">training step (2 epochs = 342 steps)</text>
  <text x="18" y="175" fill="#333" font-size="13" text-anchor="middle" transform="rotate(-90 18 175)">dev NDCG@10 (full corpus)</text>

  <!-- B1 baseline: the shared starting model -->
  <line x1="70" y1="224.5" x2="720" y2="224.5" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- E2: BM25-hard negatives (3 seeds) -->
  <g fill="none" stroke="#ff7f0e" stroke-width="2" stroke-dasharray="6 3.5">
    <polyline points="70,224.5 217.1,263.2 362.5,289.5 509.6,226.3 655,238.2"/>
    <polyline points="70,224.5 217.1,247.7 362.5,170.8 509.6,204.2 655,209.0"/>
    <polyline points="70,224.5 217.1,242.4 362.5,206.0 509.6,213.8 655,228.7"/>
  </g>
  <g fill="#ff7f0e">
    <rect x="213.6" y="259.7" width="7" height="7"/><rect x="359" y="286" width="7" height="7"/><rect x="506.1" y="222.8" width="7" height="7"/><rect x="651.5" y="234.7" width="7" height="7"/>
    <rect x="213.6" y="244.2" width="7" height="7"/><rect x="359" y="167.3" width="7" height="7"/><rect x="506.1" y="200.7" width="7" height="7"/><rect x="651.5" y="205.5" width="7" height="7"/>
    <rect x="213.6" y="238.9" width="7" height="7"/><rect x="359" y="202.5" width="7" height="7"/><rect x="506.1" y="210.3" width="7" height="7"/><rect x="651.5" y="225.2" width="7" height="7"/>
  </g>

  <!-- E1: random negatives (3 seeds) -->
  <g fill="none" stroke="#1f77b4" stroke-width="2">
    <polyline points="70,224.5 217.1,177.4 362.5,99.9 509.6,108.2 655,115.4"/>
    <polyline points="70,224.5 217.1,141.6 362.5,88.0 509.6,76.0 655,62.3"/>
    <polyline points="70,224.5 217.1,104.7 362.5,80.2 509.6,55.8 655,75.4"/>
  </g>
  <g fill="#1f77b4">
    <circle cx="217.1" cy="177.4" r="3.6"/><circle cx="362.5" cy="99.9" r="3.6"/><circle cx="509.6" cy="108.2" r="3.6"/><circle cx="655" cy="115.4" r="3.6"/>
    <circle cx="217.1" cy="141.6" r="3.6"/><circle cx="362.5" cy="88.0" r="3.6"/><circle cx="509.6" cy="76.0" r="3.6"/><circle cx="655" cy="62.3" r="3.6"/>
    <circle cx="217.1" cy="104.7" r="3.6"/><circle cx="362.5" cy="80.2" r="3.6"/><circle cx="509.6" cy="55.8" r="3.6"/><circle cx="655" cy="75.4" r="3.6"/>
  </g>

  <!-- shared start point -->
  <circle cx="70" cy="224.5" r="3.6" fill="#8a8a8a"/>

  <!-- series labels -->
  <text x="663" y="92" fill="#1f77b4" font-size="12" font-weight="bold">E1</text>
  <text x="663" y="229" fill="#ff7f0e" font-size="12" font-weight="bold">E2</text>

  <!-- legend -->
  <g font-size="12" fill="#444">
    <line x1="112" y1="397" x2="140" y2="397" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="147" y="401">B1 original MiniLM</text>

    <line x1="283" y1="397" x2="311" y2="397" stroke="#1f77b4" stroke-width="2"/>
    <circle cx="297" cy="397" r="3.6" fill="#1f77b4"/>
    <text x="318" y="401">E1 random negatives</text>

    <line x1="465" y1="397" x2="493" y2="397" stroke="#ff7f0e" stroke-width="2" stroke-dasharray="6 3.5"/>
    <rect x="475.5" y="393.5" width="7" height="7" fill="#ff7f0e"/>
    <text x="500" y="401">E2 BM25-hard negatives</text>
  </g>
</svg>
